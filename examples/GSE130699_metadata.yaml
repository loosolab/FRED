project:
  id: GSE130699
  project_name: Single-nucleus RNA-seq of mouse ventricular cardiomyocytes (cardiac
    regeneration)
  date: 18.03.2020
  description: |
    Single-nucleus RNA-seq dataset examining cardiac regeneration potential in mouse ventricular cardiomyocytes across two injury conditions (LAD-ligation, sham), two developmental stages (postnatal day 1 and day 8), and two post-operative time points (day 1 and day 3). Source: Cui et al. 2020, Developmental Cell 53, 102-116. GEO accession GSE130699.
  owner:
    name: Mustermann, Max
    ldap_name: mmuster
    department: AG-Mustermann
    email: max.mustermann@email.de
  further_description:
  - 'DOI: 10.1016/j.devcel.2020.02.019'
  - https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE130699
  publication:
  - pubmed_id: 32220304
    title: Dynamic Transcriptional Responses to Injury of Regenerative and Non-regenerative
      Cardiomyocytes Revealed by Single-Nucleus RNA Sequencing.
    year: 2020
    author:
    - Cui M
    - Wang Z
    - Chen K
    - et. al
    journal: Dev Cell
    volume: 53
    issue: 1
    pages: 102-116.e8
    doi: 10.1016/j.devcel.2020.02.019
